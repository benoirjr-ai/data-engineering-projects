services:

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    container_name: insurance_kafka
    hostname: kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:

      # ==========================================
      # Memory
      # ==========================================
      # Important for an 8 GB RAM laptop.
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"


      # ==========================================
      # KRaft configuration
      # ==========================================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093


      # ==========================================
      # Listeners
      # ==========================================
      # INTERNAL:
      # Used by containers communicating with Kafka.
      #
      # EXTERNAL:
      # Used by applications running on Windows.
      #
      # CONTROLLER:
      # Used by Kafka's KRaft controller.
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER


      # ==========================================
      # Single-node development configuration
      # ==========================================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"


      # ==========================================
      # Local storage optimization
      # ==========================================
      # Keep the development environment small.
      KAFKA_LOG_RETENTION_HOURS: 24

      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000


      # ==========================================
      # KRaft cluster ID
      # ==========================================
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk


    # ==========================================
    # Persistent Kafka storage
    # ==========================================
    volumes:
      - kafka_data:/var/lib/kafka/data


volumes:
  kafka_data: