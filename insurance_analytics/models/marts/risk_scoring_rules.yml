    meta:
      scoring_method: >
        Transparent rule-based analytical scoring from 0 to 10.
        Scores are based on observable claim behavior and are
        not a determination of fraud.

      scoring_rules:
        - "claim_count >= 5: +1"
        - "claims_last_7_days >= 3: +2"
        - "high_value_claim_count >= 2: +2"
        - "maximum_claim_value >= 20000: +2"
        - "total_risk_indicators >= 6: +2"
        - "distinct_countries >= 3: +1"