[project]
name = "fraud-detection-pipeline"
version = "0.1.0"
description = "A local streaming data pipeline for insurance claim validation, enrichment, and fraud-risk analytics."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "confluent-kafka>=2.15.1",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "faker>=40.40.0",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "streamlit>=1.64.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]